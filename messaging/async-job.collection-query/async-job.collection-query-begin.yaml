openapi: 3.1.0
info:
  title: Структура сообщения `async-job.collection-query-begin`
  version: 1.0.0
paths: {}
components:
  schemas:
    Message:
      type: object
      properties:
        headers:
          allOf:
            - $ref: '../common-orchestration-message.yaml#/components/schemas/MessageHeaders'
            - $ref: '#/components/schemas/MessageHeaders'
        payload:
          allOf:
            - $ref: '../common-orchestration-message.yaml#/components/schemas/MessagePayload'
            - $ref: '#/components/schemas/MessagePayload'
      required:
        - headers
        - payload
  MessageHeaders:
    type: object
    properties:
      type:
        type: string
        enum:
          - async-job.collection-query-begin
        description: Тип сообщения
      required:
        - type
  MessagePayload:
    type: object
    properties:
      query:
        type: string
        description: Поисковый запрос
      searchQueryUuid:
        type: string
        format: uuid
        description: UUID строки в `settings.search_queries` (передаётся в job-postings-crud при сохранении вакансий).
      lazy:
        type: boolean
        default: false
        description: |
          При `true` обход страниц прерывается, если на текущей странице нет новых `uid`;
          при `false` (по умолчанию) цикл по страницам продолжается.
      required:
        - searchQueryUuid
        - query