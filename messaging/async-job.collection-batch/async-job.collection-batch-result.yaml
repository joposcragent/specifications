openapi: 3.1.0
info:
  title: Структура сообщения `async-job.collection-batch-result`
  version: 1.0.0
paths: {}
components:
  schemas:
    Message:
      type: object
      properties:
        headers:
          allOf:
            - $ref: '../common-orchestration-message.yaml#/components/schemas/MessageHeaders'
            - $ref: '#/components/schemas/MessageHeaders'
        payload:
          allOf:
            - $ref: '../common-async-job-result-message.yaml#/components/schemas/MessagePayload'
            - $ref: '#/components/schemas/MessagePayload'
      required:
        - headers
        - payload
    MessageHeaders:
      type: object
      properties:
        type:
          type: string
          enum:
            - async-job.collection-batch-result
          description: Тип сообщения
      required:
        - type
    MessagePayload:
      type: object
      description: |
        Результат обработки `async-job.collection-batch-begin` в orchestration-conductor.
        `SUCCEEDED` — fan-out дочерних collection-query-begin выполнен;
        `CANCELED` — нет активных поисковых запросов;
        `FAILED` — ошибка при обработке begin.
      properties:
        childJobsDispatched:
          type: integer
          minimum: 0
          description: Число опубликованных `async-job.collection-query-begin` (обычно при `status` = `SUCCEEDED`)
