openapi: 3.1.0
info:
  title: Настройки шедулера orchestration-scheduler
  description: ''
  version: 2.0.0
servers:
  - url: http://orchestration-scheduler:8080/
  - url: http://localhost:8083/

paths:
  /execute:
    post:
      description: Принудительный немедленный запуск джоба
      parameters:
        - $ref: '#/components/parameters/JobType'
      responses: 
        '200':
          description: Джоб успешно запущен
        '400':
          $ref: '#/components/responses/IncorrectRequest'
        '500':
          $ref: '#/components/responses/UncaughtException'
  /settings/list:
    get:
      description: Получение полной таблицы настроек
      responses:
        '200':
          description: Таблица настроек всех типов джобов
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/SchedulerSettingsList'
        '500':
          $ref: '#/components/responses/UncaughtException'
      
  /settings:
    get:
      description: Чтение настроек шедулера для указанного типа задачи
      parameters:
        - $ref: '#/components/parameters/JobType'
      responses:
        '200':
          description: Настройки шедулера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerSettingsItem'
        '500':
          $ref: '#/components/responses/UncaughtException'
  /settings/interval:
    put:
      description: Обновление длительности интервала между запусками в формате [RFC3339](https://www.ietf.org/archive/id/draft-tsai-duration-00.html#name-internet-duration-format)
      parameters:
        - $ref: '#/components/parameters/JobType'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInterval'
      responses:
        '200':
          description: Расписание обновлено
        '400':
          $ref: '#/components/responses/IncorrectRequest'
        '500':
          $ref: '#/components/responses/UncaughtException'
  /settings/next-run:
    put:
      description: Принудительная установка даты следующего запуска для указанного типа задачи
      parameters:
        - $ref: '#/components/parameters/JobType'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNextRun'
      responses:
        '200':
          description: Дата следующего запуска обновлена
        '400':
          $ref: '#/components/responses/IncorrectRequest'
        '500':
          $ref: '#/components/responses/UncaughtException'
components:
  schemas:
    SchedulerJobType:
      type: string
      enum:
        - COLLECTION_BATCH
        - RETENTION
      description: Значение orchestration.scheduler_jobs / колонки scheduler.job_type
    UpdateNextRun:
      type: object
      properties:
        value:
          description: Дата и время следующего запуска (ISO-8601 `date-time`, с часовым поясом)
          type: string
          format: date-time
      required:
        - value
    UpdateInterval:
      type: object
      properties:
        value:
          type: string
          example: 'PT6H'
      required:
        - value
    SchedulerSettingsList:
      type: object
      properties:
        list:
          type: array
          items: 
            $ref: '#/components/schemas/SchedulerSettingsItem'
    SchedulerSettingsItem:
      type: object
      properties:
        jobType:
          $ref: '#/components/schemas/SchedulerJobType'
        nextRun:
          type:
            - string
            - 'null'
          format: date-time
        interval:
          type:
            - string
            - 'null'
          example: 'PT1H'
        previousRun:
          type:
            - string
            - 'null'
          format: date-time
          description: Момент последнего срабатывания тика в памяти процесса; не из БД
      required:
        - jobType
        - nextRun
        - interval
        - previousRun
    UuidsList:
      description: Список UUID (строки в формате UUID)
      type: object
      properties:
        list:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
      required:
        - list
  parameters:
    JobType:
      name: jobType
      in: query
      required: false
      description: Тип задачи планировщика; если не указан, используется COLLECTION_BATCH
      schema:
        type: string
        enum:
          - COLLECTION_BATCH
          - RETENTION
        default: COLLECTION_BATCH
    RequiredEntityUuid:
      name: jobPostingUuid
      in: path
      description: Внутренний UUID вакансии
      schema:
        type: string
        format: uuid
      required: true
  responses:
    IncorrectRequest:
      description: Запрос не корректный
      content:
        text/plain:
          schema:
            type: string
          example: "Не задан обязательный параметр paramName"
    UncaughtException:
      description: Необработанное исключение
      content:
        text/plain:
          schema:
            type: string
          example: "org.jooq.exception.DataAccessException: connection refused"
