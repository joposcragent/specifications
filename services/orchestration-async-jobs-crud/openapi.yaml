openapi: 3.1.0
info:
  title: CRUD-операции над асинхронными джобами
  version: 1.0.0
servers:
  - url: http://orchestration-async-jobs-crud:8080/
  - url: http://localhost:8085/  
tags:
  - name: AsyncJobsController
    description: Работа с данными асинхронных джобов
paths: 
  /async-jobs/{jobUuid}:
    post:
      description: Создать новый джоб
      tags: 
        - AsyncJobsController
      parameters: 
        - name: jobUuid
          in: path
          schema: 
            type: string
            format: uuid
          required: true
      requestBody: 
        content: 
          application/json:
            schema: 
              $ref: '#/components/schemas/CreateAsyncJobItem'
      responses: 
        '200':
          description: Ok
        '400':
          description: Запрос некорректный
        '409':
          description: Такой джоб уже существует
        '500':
          $ref: '#/components/responses/UncaughtException'          
    patch: 
      description: Обновить данные джоба
      tags: 
        - AsyncJobsController
      parameters: 
        - name: jobUuid
          in: path
          schema: 
            type: string
            format: uuid
          required: true
      requestBody: 
        content: 
          application/json: 
            schema: 
              $ref: '#/components/schemas/PatchAsyncJobItem'
      responses: 
        '200':
          description: Ok
        '400':
          description: Запрос некорректный
        '404':
          description: Джоб не найден
        '500':
          $ref: '#/components/responses/UncaughtException'
    get:
      description: Получение данных асинхронного джоба
      tags: 
        - AsyncJobsController
      parameters: 
        - name: jobUuid
          in: path
          schema: 
            type: string
            format: uuid
          required: true
      responses: 
        '200':
          description: Данные асинхронного джоба
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/AsyncJobItem'
        '404':
          description: Не найден джоб с таким uuid
        '400':
          description: Некорректный запрос
        '500':
          $ref: '#/components/responses/UncaughtException'
  /async-jobs/{jobUuid}/finish/{terminalStatus}:
    post:
      description: Установка завершающего статуса для джоба
      tags: 
        - AsyncJobsController
      parameters: 
        - name: jobUuid
          in: path
          schema: 
            type: string
            format: uuid
          required: true
        - name: terminalStatus
          in: path
          schema:
            $ref: '#/components/schemas/AsyncJobTerminalStatus'
          required: true
      responses: 
        '200':
          description: Джоб завершен
        '404':
          description: Не найден джоб с таким uuid
        '400':
          description: Некорректный запрос
        '409':
          description: Джоб уже завершен
        '500':
          $ref: '#/components/responses/UncaughtException' 

  /async-jobs/{jobUuid}/related/{entityKind}/{entityUuid}:
    post:
      description: Добавить связи джоба
      tags: 
        - AsyncJobsController
      parameters: 
        - name: jobUuid
          in: path
          schema: 
            type: string
            format: uuid
          required: true
        - name: entityKind
          in: path
          description: Вид связанной сущности
          schema: 
            type: string
            enum: 
              - POSTING
              - QUERY
          required: true
        - name: entityUuid
          in: path
          description: UUID связанной сущности
          schema: 
            type: string
            format: uuid
          required: true
      responses: 
        '200':
          description: Связь установлена
        '404':
          description: Не найден джоб с таким uuid
        '400':
          description: Некорректный запрос
        '409':
          description: Такая связь уже установлена
        '500':
          $ref: '#/components/responses/UncaughtException' 

  /async-jobs/list:
    get:
      description: Получение списка асинхронных джобов 
      tags: 
        - AsyncJobsController
      parameters: 
        - name: parentJobUuid
          description: Только непосредственные потомки {parentJobUuid}
          in: query
          schema: 
            type: string
            format: uuid
        - name: status
          description: Только в статусе {status}
          in: query
          schema: 
            $ref: '#/components/schemas/AsyncJobStatus'
        - name: startedBefore
          description: Только запущенные не позднее {startedBefore}
          in: query
          schema: 
            type: string
            format: date-time
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Page'
      responses: 
        '200':
          description: Ok
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/AsyncJobList'
        '500':
          $ref: '#/components/responses/UncaughtException'
  /async-jobs/list/related/{entityUuid}:
    get:
      description: Получение списка асинхронных джобов, связанных с {entityUuid}
      tags: 
        - AsyncJobsController
      parameters: 
        - name: entityUuid
          in: path
          required: true
          schema: 
            type: string
            format: uuid
        - name: status
          description: Только в статусе {status}
          in: query
          schema: 
            $ref: '#/components/schemas/AsyncJobStatus'
        - name: startedBefore
          description: Только запущенные не позднее {startedBefore}
          in: query
          schema: 
            type: string
            format: date-time
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Page'
      responses: 
        '200':
          description: Ok
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/AsyncJobList'
        '400':
          description: Некорректный запрос
        '500':
          $ref: '#/components/responses/UncaughtException'
  
  /async-jobs/hierarchy/{parentJobUuid}:
    get:
      description: Получение всей иерархии джобов с корнем {parentJobUuid}
      tags: 
        - AsyncJobsController
      parameters: 
        - name: parentJobUuid
          description: Голова иерархии джобов
          in: path
          required: true
          schema: 
            type: string
            format: uuid
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Page'
      responses: 
        '200':
          description: Ok
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/AsyncJobHierarchy'
        '404':
          description: Не найден джоб с таким parentJobUuid
        '400':
          description: Некорректный запрос
        '500':
          $ref: '#/components/responses/UncaughtException'

  /async-jobs/hierarchy/related/{entityUuid}:
    get:
      description: Получение всех джобов, связанных с {entityUuid}
      tags: 
        - AsyncJobsController
      parameters: 
        - name: entityUuid
          in: path
          required: true
          schema: 
            type: string
            format: uuid
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Ok
          content:
            application/json: 
              schema: 
                $ref: '#/components/schemas/AsyncJobHierarchyRelatedList'
        '400':
          description: Некорректный запрос
        '500':
          $ref: '#/components/responses/UncaughtException'

components:
  schemas:
    AsyncJobHierarchyRelatedList:
      type: object
      properties: 
        list:
          type: array
          items: 
            $ref: '#/components/schemas/AsyncJobHierarchy'
      required: 
        - list
    AsyncJobHierarchy:
      type: object
      properties: 
        root:
          $ref: '#/components/schemas/AsyncJobItem'
        children:
          type: array
          items:
            $ref: '#/components/schemas/AsyncJobHierarchy'
      required: 
        - root
        - children
    CreateAsyncJobItem:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        parentUuid:
          type: string
          format: uuid
        context:
          type: object
          additionalProperties: true
          description: Произвольный JSON-объект контекста джоба; при отсутствии в теле в БД записывается NULL
      required:
        - uuid
        - name
    PatchAsyncJobItem:
      type: object
      properties: 
        name:
          type: string
        parentUuid:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AsyncJobStatus'
        result:
          type: string
        context:
          type: object
          additionalProperties: true
          description: Частичное обновление; значение null сбрасывает context в NULL
        finished_at:
          type: string
          format: date-time
      minProperties: 1
    AsyncJobItem:
      type: object
      properties: 
        uuid:
          type: string
          format: uuid
        name:
          type: string
        parentUuid:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AsyncJobStatus'
        context:
          type: object
          additionalProperties: true
          description: Контекст джоба из колонки context; null если в БД NULL
        result:
          type: string
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
      required: 
        - uuid
        - name
        - status
        - started_at
    AsyncJobList:
      type: object
      properties: 
        list:
          type: array
          items: 
            $ref: '#/components/schemas/AsyncJobItem'
      required: 
        - list
    AsyncJobStatus:
      type: string
      enum:
        - STARTED
        - SUCCEEDED
        - FAILED
        - CANCELED
    AsyncJobTerminalStatus:
      type: string
      enum:
        - SUCCEEDED
        - FAILED
        - CANCELED
  parameters:
    Size:
      name: size
      in: query
      description: Размер страницы (по умолчанию 20; значения < 1 приводятся к 1)
      schema:
        type: integer
        default: 20
      required: false
    Page:
      name: page
      in: query
      description: Номер страницы (по умолчанию 1; значения < 1 приводятся к 1)
      schema:
        type: integer
        default: 1
      required: false
  responses:
    UncaughtException:
      description: Необработанное исключение
      content:
        text/plain:
          schema:
            type: string
          example: "org.jooq.exception.DataAccessException: connection refused"
