openapi: 3.1.0
info:
  title: Управление профилем пользователя
  version: 1.2.1
servers:
  - url: http://settings-manager:8080/
  - url: http://localhost:8080/
tags:
  - name: reference-context
    description: Контроллер управления эталонным контекстом
  - name: search-query
    description: Контроллер управления поисковыми запросами
  - name: query-selector
    description: Контроллер настройки CSS-селекторов
  - name: prompt-template
    description: Шаблон промпта для сопроводительного письма
paths:
  /reference-context:
    get:
      description: Получение эталонного контекста
      tags:
        - reference-context
      responses:
        "200":
          description: Текст эталонного контекста
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceContext"
        "202":
          description: Эталонный контекст не задан
        "500":
          $ref: "#/components/responses/UncaughtException"

    post:
      description: Установка эталонного контекста
      tags:
        - reference-context
      requestBody:
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Эталонный контекст установлен; тело — только вектор и метки времени (без текста)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceContextPersisted"
        "500":
          $ref: "#/components/responses/UncaughtException"

  /prompt-template:
    get:
      description: Получение шаблона промпта
      tags:
        - prompt-template
      responses:
        "200":
          description: Текущий шаблон и метки времени
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptTemplate"
        "404":
          description: В таблице нет строки
        "500":
          $ref: "#/components/responses/UncaughtException"
    post:
      description: Сохранение шаблона промпта
      tags:
        - prompt-template
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Шаблон сохранён; тело — актуальный объект PromptTemplate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptTemplate"
        "500":
          $ref: "#/components/responses/UncaughtException"

  /search-query/list:
    get:
      tags:
        - search-query
      description: |
        Получение списка настроенных поисковых запросов.
        При `activeOnly=true` возвращаются только строки с `isActive = true` (используется плановым заданием `COLLECTION_BATCH` в `orchestration-scheduler` при пакетном сборе).
      parameters:
        - name: activeOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Если true — только активные запросы (`is_active = true` в БД).
      responses:
        "200":
          description: Список запросов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchQueriesList"
        "500":
          $ref: "#/components/responses/UncaughtException"
  /search-query/{entityUuid}:
    post:
      tags:
        - search-query
      description: Добавление нового поискового запроса
      parameters:
        - $ref: "#/components/parameters/EntityUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchQueryCreateRequest"
            example:
              name: CTO / Tech lead
              query: https://hh.ru/search/vacancy?area=1&items_on_page=20
              contentRelevance: 0.82
              notificationRelevance: 0.92
              isActive: true
              isLazyScraping: false
      responses:
        "409":
          description: Запрос с таким UUID уже есть в базе
        "200":
          description: "Добавление нового поискового запроса"
        "500":
          $ref: "#/components/responses/UncaughtException"
    patch:
      tags:
        - search-query
      description: Обновление поискового запроса
      parameters:
        - $ref: "#/components/parameters/EntityUuid"
      requestBody:
        required: true
        description: >
          Частичное обновление: допустимо передать любое подмножество полей
          `name`, `query`, `contentRelevance`, `notificationRelevance`, `isActive`, `isLazyScraping`;
          пустое тело или объект без ни одного из полей — ошибка клиента.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchQueryPatchRequest"
            example:
              query: https://hh.ru/search/vacancy?area=1
              contentRelevance: 0.85
      responses:
        "404":
          description: Запрос с таким entityUuid не найден
        "400":
          description: Не передано ни одно поле для обновления или нарушены ограничения полей
        "200":
          description: "Обновлен успешно"
    delete:
      tags:
        - search-query
      description: Удаление поискового запроса
      parameters:
        - $ref: "#/components/parameters/EntityUuid"
      responses:
        "404":
          description: Запрос с таким entityUuid не найден
        "200":
          description: "Удален успешно"
    get:
      tags:
        - search-query
      description: Получение поискового запроса
      parameters:
        - $ref: "#/components/parameters/EntityUuid"
      responses:
        "404":
          description: Запрос с таким entityUuid не найден
        "200":
          description: Объект поискового запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchQueriesItem"

components:
  schemas:
    ReferenceContext:
      type: object
      properties:
        context:
          type: string
        vector:
          type: array
          items:
            type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - context
        - vector
        - createdAt
    PromptTemplate:
      type: object
      description: Шаблон промпта для генерации сопроводительного письма
      properties:
        template:
          type: string
          nullable: true
          description: Текст шаблона с плейсхолдерами ${JOB_POSTING_CONTENT} и ${RESUME}
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - createdAt
    ReferenceContextPersisted:
      type: object
      description: Результат успешного POST /reference-context (без поля context)
      properties:
        vector:
          type: array
          items:
            type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - vector
        - createdAt
    SearchQueriesList:
      type: array
      items:
        $ref: "#/components/schemas/SearchQueriesItem"
    SearchQueriesItem:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 512
        query:
          type: string
          description: |
            Содержимое поиска в формате query-string (часть URL после `?` для выбранной страницы поиска на hh.ru).
            Допустимо хранение унаследованного полного URL; UI при открытии ссылок может собирать адрес из базы и этой строки.
        contentRelevance:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Порог косинусного сходства для классификации контента вакансии (0–1).
        notificationRelevance:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Порог для будущих уведомлений (0–1); хранится вместе с запросом.
        isActive:
          type: boolean
          description: Участвует ли запрос в плановом сборе (`task.collection-batch`).
        isLazyScraping:
          type: boolean
          description: |
            При `true` краулер останавливает обход страниц, если на странице нет новых uid;
            при `false` продолжает следующие страницы.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - uuid
        - name
        - query
        - contentRelevance
        - notificationRelevance
        - isActive
        - isLazyScraping
        - createdAt
    SearchQueryCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 512
        query:
          type: string
          minLength: 1
          description: Query-string (после `?`) или унаследованный полный URL hh.ru; см. описание `SearchQueriesItem.query`.
        contentRelevance:
          type: number
          format: double
          minimum: 0
          maximum: 1
        notificationRelevance:
          type: number
          format: double
          minimum: 0
          maximum: 1
        isActive:
          type: boolean
          description: По умолчанию на сервере `true`, если поле не передано.
        isLazyScraping:
          type: boolean
          description: По умолчанию на сервере `false`, если поле не передано.
      required:
        - name
        - query
        - contentRelevance
        - notificationRelevance
    SearchQueryPatchRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 512
        query:
          type: string
          minLength: 1
          description: Query-string (после `?`) или полный URL hh.ru; см. `SearchQueriesItem.query`.
        contentRelevance:
          type: number
          format: double
          minimum: 0
          maximum: 1
        notificationRelevance:
          type: number
          format: double
          minimum: 0
          maximum: 1
        isActive:
          type: boolean
        isLazyScraping:
          type: boolean
  parameters:
    EntityUuid:
      name: entityUuid
      in: path
      schema:
        type: string
        format: uuid
      required: true
  responses:
    UncaughtException:
      description: Неизвестная ошибка
      content:
        text/plain:
          schema:
            type: string
          example: |
            2020-12-04 15:03:12.926 ERROR 80850 --- [         task-1] .a.i.SimpleAsyncUncaughtExceptionHandler : Unexpected exception occurred invoking async method: public void com.yawintutor.TestService.print(int)
                java.lang.ArithmeticException: / by zero
                  at com.yawintutor.TestService.print(TestService.java:15) ~[classes/:na]
                  at com.yawintutor.TestService$$FastClassBySpringCGLIB$$284b10a4.invoke(<generated>) ~[classes/:na]
                  at org.springframework.cglib.proxy.MethodProxy.invoke(MethodProxy.java:218) ~[spring-core-5.3.1.jar:5.3.1]
                  at org.springframework.aop.framework.CglibAopProxy$CglibMethodInvocation.invokeJoinpoint(CglibAopProxy.java:771) ~[spring-aop-5.3.1.jar:5.3.1]
                  at org.springframework.aop.framework.ReflectiveMethodInvocation.proceed(ReflectiveMethodInvocation.java:163) ~[spring-aop-5.3.1.jar:5.3.1]
                  at org.springframework.aop.framework.CglibAopProxy$CglibMethodInvocation.proceed(CglibAopProxy.java:749) ~[spring-aop-5.3.1.jar:5.3.1]
                  at org.springframework.aop.interceptor.AsyncExecutionInterceptor.lambda$invoke$0(AsyncExecutionInterceptor.java:115) ~[spring-aop-5.3.1.jar:5.3.1]
                  at java.util.concurrent.FutureTask.run(FutureTask.java:266) ~[na:1.8.0_101]
                  at java.util.concurrent.ThreadPoolExecutor.runWorker(ThreadPoolExecutor.java:1142) ~[na:1.8.0_101]
                  at java.util.concurrent.ThreadPoolExecutor$Worker.run(ThreadPoolExecutor.java:617) ~[na:1.8.0_101]
                  at java.lang.Thread.run(Thread.java:745) ~[na:1.8.0_101]
