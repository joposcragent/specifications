openapi: 3.1.0
info:
  title: REST API для оркестратора джобов
  version: 1.0.0
tags:
  - name: TopicsController
    description: Отправка сообщений в очереди
  - name: AsyncJobsController
    description: Работа с данными асинхронных джобов
paths:
  /enqueue/collection-batch:
    post:
      summary: Запустить collection-batch вручную
      description: |
        Эта ручка нужна для ручного запуска пакетного сбора с фронта.
        Успешное выполнение приводит к отправке в очередь сообщения `async-job.collection-batch-begin`
      responses:
        '204':
          description: Сообщение отправлено в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobUuid'
        '500':
          $ref: '#/components/responses/UncaughtException'
  /enqueue/collection-query:
    post:
      summary: Запустить collection-query вручную
      description: |
        Эта ручка нужна для ручного запуска сбора по одному запросу с фронта.
        Успешное выполнение приводит к отправке в очередь сообщения `async-job.collection-query-begin`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchQueryItem'
      responses:
        '204':
          description: Сообщение отправлено в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobUuid'
        '500':
          $ref: '#/components/responses/UncaughtException'
components:
  schemas:
    AsyncJobUuid:
      type: object
      properties:
        jobUuid:
          type: string
          format: uuid
          description: UUID нового асинхронного джоба
      required:
        - jobUuid
    SearchQueryItem:
      type: object
      properties:
        query:
          type: string
          description: Поисковый запрос
        uuid:
          type: string
          format: uuid
          description: UUID строки в `settings.search_queries` (передаётся в job-postings-crud при сохранении вакансий).
        isLazyScraping:
          type: boolean
          default: false
          description: |
            При `true` обход страниц прерывается, если на текущей странице нет новых `uid`;
            при `false` (по умолчанию) цикл по страницам продолжается.
      required:
        - uuid
        - query
  parameters:
    Size:
      name: size
      in: query
      description: Размер страницы (по умолчанию 20; значения < 1 приводятся к 1)
      schema:
        type: integer
        default: 20
      required: false
    Page:
      name: page
      in: query
      description: Номер страницы (по умолчанию 1; значения < 1 приводятся к 1)
      schema:
        type: integer
        default: 1
      required: false
  responses:
    UncaughtException:
      description: Необработанное исключение
      content:
        text/plain:
          schema:
            type: string
          example: "org.jooq.exception.DataAccessException: connection refused"
