openapi: 3.1.0
info:
  title: REST API для оркестратора джобов
  version: 1.0.0
tags:
  - name: TopicsController
    description: Отправка сообщений в очереди
  - name: AsyncJobsController
    description: Работа с данными асинхронных джобов
paths: 
  /topic/{messageType}:
    post:
      description: Отправка сообщения в очередь
      tags:
        - TopicsController
      parameters: 
        - name: messageType
          in: path
          schema: 
            type: string
            enum:
              - collection-batch
              - collection-query
              - job-posting-create
              - async-job-end
          required: true
      requestBody: 
        content: 
          application/json: 
            schema: 
              $ref: '#/components/schemas/CommonMessage'
      responses: 
        '202':
          description: accepted
        '500':
          $ref: '#/components/responses/UncaughtException'
  /topic/async-job-end:
    post:
      description: Отправка сообщения async-job-end в очередь
      tags:
        - TopicsController
      requestBody: 
        content: 
          application/json: 
            schema: 
              $ref: '#/components/schemas/AsyncJobEndMessage'
      responses: 
        '202':
          description: accepted
        '500':
          $ref: '#/components/responses/UncaughtException'
  /async-jobs/{jobUuid}:
    get:
      description: Получение данных асинхронного джоба
      tags: 
        - AsyncJobsController
      parameters: 
        - name: jobUuid
          in: path
          schema: 
            type: string
            format: uuid
          required: true
      responses: 
        '200':
          description: Данные асинхронного джоба
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/AsyncJobItem'
        '404':
          description: Не найден джоб с таким uuid
        '400':
          description: Не корректный запрос
        '500':
          $ref: '#/components/responses/UncaughtException'
  /async-jobs/list:
    get:
      description: Получение списка асинхронных джобов 
      tags: 
        - AsyncJobsController
      parameters: 
        - name: parentJobUuid
          description: Только непосредственные потомки {parentJobUuid}
          in: query
          schema: 
            type: string
            format: uuid
        - name: status
          description: Только в статусе {status}
          in: query
          schema: 
            $ref: '#/components/schemas/AsyncJobStatus'
        - name: startedBefore
          description: Только запущенные не позднее {startedBefore}
          in: query
          schema: 
            type: string
            format: date-time
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Page'
      responses: 
        '200':
          description: Ok
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/AsyncJobList'
        '500':
          $ref: '#/components/responses/UncaughtException'
  /async-jobs/list/related/{entityUuid}:
    get:
      description: Получение списка асинхронных джобов, связанных с {entityUuid}
      tags: 
        - AsyncJobsController
      parameters: 
        - name: entityUuid
          in: path
          required: true
          schema: 
            type: string
            format: uuid
        - name: status
          description: Только в статусе {status}
          in: query
          schema: 
            $ref: '#/components/schemas/AsyncJobStatus'
        - name: startedBefore
          description: Только запущенные не позднее {startedBefore}
          in: query
          schema: 
            type: string
            format: date-time
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Page'
      responses: 
        '200':
          description: Ok
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/AsyncJobList'
        '400':
          description: Не корректный запрос
        '500':
          $ref: '#/components/responses/UncaughtException'
  
  /async-jobs/hierarchy/{parentJobUuid}:
    get:
      description: Поулчение всей иерархию джобов, начинающейся на {parentJobUuid}
      tags: 
        - AsyncJobsController
      parameters: 
        - name: parentJobUuid
          description: Голова иерархии джобов
          in: path
          required: true
          schema: 
            type: string
            format: uuid
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Page'
      responses: 
        '200':
          description: Ok
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/AsyncJobHierarchy'
        '404':
          description: Не найден джоб с таким parentJobUuid
        '400':
          description: Не корректный запрос
        '500':
          $ref: '#/components/responses/UncaughtException'

  /async-jobs/hierarchy/related/{entityUuid}:
    get:
      description: Получение всех джобов, связанных с {entityUuid}
      tags: 
        - AsyncJobsController
      parameters: 
        - name: entityUuid
          in: path
          required: true
          schema: 
            type: string
            format: uuid
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Ok
          content:
            application/json: 
              schema: 
                $ref: '#/components/schemas/AsyncJobHierarchy'
        '400':
          description: Не корректный запрос
        '500':
          $ref: '#/components/responses/UncaughtException'

components:
  schemas:
    AsyncJobHierarchyRelatedList:
      type: object
      properties: 
        list:
          type: array
          items: 
            $ref: '#/components/schemas/AsyncJobHierarchy'
      required: 
        - list
    AsyncJobHierarchy:
      type: object
      properties: 
        root:
          $ref: '#/components/schemas/AsyncJobItem'
        children:
          type: array
          items:
            $ref: '#/components/schemas/AsyncJobList'
      required: 
        - root
        - children
    AsyncJobItem:
      type: object
      properties: 
        uuid:
          type: string
          format: uuid
        name:
          type: string
        parentUuid:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AsyncJobStatus'
        result:
          type: string
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
      required: 
        - uuid
        - name
        - status
        - started_at
    AsyncJobList:
      type: object
      properties: 
        list:
          type: array
          items: 
            $ref: '#/components/schemas/AsyncJobItem'
      required: 
        - list
    AsyncJobStatus:
      type: string
      enum:
        - STARTED
        - SUCCEEDED
        - FAILED
        - CANCELED
    AsyncJobEndMessage:
      type: object
      properties:
        headers:
          $ref:  '#/components/schemas/MessageHeaders'
        payload:
          $ref:  '#/components/schemas/AsyncJobEndMessagePayload'
      required: 
        - headers
        - payload
    CommonMessage:
      type: object
      properties:
        headers:
          $ref:  '#/components/schemas/MessageHeaders'
        payload:
          $ref:  '#/components/schemas/MessagePayload'
      required: 
        - headers
        - payload
    MessageHeaders:
      type: object
      properties:
        key:
          type: string
          description: Ключ идемпотентности сообщения
        createdAt:
          type: string
          format: date-time
          description: Дата, когда сообщение было помещено в очередь
      additionalProperties: true
      required: 
        - key
        - createdAt
    MessagePayload:
      type: object
      properties:
        jobUuid:
          type: string
          format: uuid
          description: UUID асинхронного джоба
        entityUuid:
          type: string
          format: uuid
          description: UUID вакаснии или поискового запроса
        status:
          type: string
          enum:
            - SUCCEEDED
            - FAILED
            - CANCELED
        result:
          type: object
          additionalProperties: true
          description: Дополнительный контекст, произвольный JSON-объект; консьюмер сам знает, как это парсить
      required:
        - jobUuid
        - status
    AsyncJobEndMessagePayload:
      type: object
      properties:
        jobUuid:
          type: string
          format: uuid
          description: UUID асинхронного джоба
        entityUuid:
          type: string
          format: uuid
          description: UUID вакаснии или поискового запроса
        status:
          type: string
          enum:
            - SUCCEEDED
            - FAILED
            - CANCELED
        result:
          type: object
          additionalProperties: true
          description: Дополнительный контекст, произвольный JSON-объект; консьюмер сам знает, как это парсить
      required:
        - jobUuid
        - status
  parameters: 
    Size:
      name: size
      in: query
      description: Размер страницы (по умолчанию 20; значения < 1 приводятся к 1)
      schema:
        type: integer
        default: 20
      required: false
    Page:
      name: page
      in: query
      description: Номер страницы (по умолчанию 1; значения < 1 приводятся к 1)
      schema:
        type: integer
        default: 1
      required: false
  responses:
    UncaughtException:
      description: Необработанное исключение
      content:
        text/plain:
          schema:
            type: string
          example: "org.jooq.exception.DataAccessException: connection refused"
